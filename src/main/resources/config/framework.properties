# ==================== APP & DEVICE CONFIG ====================
platform=Android
deviceName=emulator-5554
automationName=UiAutomator2
appPackage=com.watb.chefmate
appActivity=com.watb.chefmate.ui.main.MainActivity

# ==================== APPIUM SERVER ====================
appium.server.url=http://127.0.0.1:4723

# ==================== TIMEOUT ====================
implicit.wait=10
explicit.wait=15
page.load.timeout=20
new.command.timeout=300

# ==================== TEST DATA ====================
default.email=00000@gmail.com
default.password=000000
default.username=0000000000

# ==================== REPORTING ====================
allure.results.directory=reports/allure
google.sheet.enabled=false
google.sheet.id=YOUR_GOOGLE_SHEET_ID
google.sheet.name=ChefMate Automation Report
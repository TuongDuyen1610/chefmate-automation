name: ChefMate E2E

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  test:
    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          adb devices

      - name: Start Appium
        shell: cmd
        run: |
          start /B appium

      - name: Wait Appium
        shell: powershell
        run: |
          Start-Sleep -Seconds 15

      - name: Run E2E Tests
        run: |
          mvn clean test -DsuiteXmlFile=suites/testng-e2e-integration.xml

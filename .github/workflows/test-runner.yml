name: ChefMate E2E

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  test:
    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          adb devices

      - name: Start Appium
        shell: cmd
        run: |
          start /B appium

      - name: Wait Appium
        shell: powershell
        run: |
          Start-Sleep -Seconds 15

      - name: Run E2E Tests
        shell: cmd
        run: |
          mvn clean test -DsuiteXmlFile="suites/testng-e2e-integration.xml"

      - name: Generate Allure Report
        run: |
          allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report

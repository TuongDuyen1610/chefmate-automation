name: ChefMate Android E2E Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 🔐 Cấp quyền cho máy ảo được phép tạo và đăng bài lên GitHub Pages
permissions:
  contents: write

jobs:
  android-e2e-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Bước 1: Kéo code mới nhất từ GitHub về máy ảo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Bước 2: Cài đặt môi trường Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
              
      # 3️⃣ Bước 3: Cài đặt NodeJS và Appium Server
      - name: Install NodeJS & Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # 5️⃣ Bước 5: Tạo máy ảo Android và chạy lệnh test Maven
      - name: Run Android Emulator and Execute Tests
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none -gpu swiftshader_indirect -accel off -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices
            mvn clean test -DsuiteXmlFile=suites/testng-e2e-integration.xml
    
    

name: ChefMate Android E2E Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 🔐 Cấp quyền cho máy ảo được phép tạo và đăng bài lên GitHub Pages
permissions:
  contents: write

jobs:
  android-e2e-test:
    runs-on: macos-13

    steps:
      # 1️⃣ Bước 1: Kéo code mới nhất từ GitHub về máy ảo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Bước 2: Cài đặt môi trường Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3️⃣ Bước 3: Cài đặt NodeJS và Appium Server
      - name: Install NodeJS & Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # 4️⃣ Bước 4: Khởi động Appium Server chạy ngầm
      - name: Run Appium Server
        run: appium --log appium.log &
        timeout-minutes: 5

      # 5️⃣ Bước 5: Tạo máy ảo Android và chạy lệnh test Maven
      - name: Run Android Emulator and Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: mvn clean test -DsuiteXmlFile=suites/testng-e2e-integration.xml

      # 6️⃣ Bước 6: Lấy lịch sử Allure cũ để vẽ biểu đồ xu hướng (Trend)
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 7️⃣ Bước 7: Tự động biên dịch Allure Results thành giao diện Web tinh chỉnh
      - name: Build Allure Report Giao Diện Web
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      # 8️⃣ Bước 8: Đăng thẳng giao diện Allure lên link GitHub Pages công khai của chị
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
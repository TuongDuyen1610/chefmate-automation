name: ChefMate Android E2E Automation CI

# 🚀 Kích hoạt chạy test khi chị push code hoặc tạo Pull Request vào nhánh main/master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  android-e2e-test:
    # ⚠️ BẮT BUỘC dùng macos để hỗ trợ tăng tốc phần cứng bật Emulator Android
    runs-on: macos-13

    steps:
      # 1️⃣ Bước 1: Kéo code mới nhất từ GitHub của chị về máy ảo
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2️⃣ Bước 2: Cài đặt môi trường Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3️⃣ Bước 3: Cài đặt NodeJS và Appium Server
      - name: Install NodeJS & Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      # 4️⃣ Bước 4: Khởi động Appium Server chạy ngầm (Đã sửa lỗi cú pháp dòng 37)
      - name: Run Appium Server
        run: appium --log appium.log &
        timeout-minutes: 5

      # 5️⃣ Bước 5: Tạo máy ảo Android, bật lên và chạy lệnh test Maven
      - name: Run Android Emulator and Execute Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: mvn clean test -DsuiteXmlFile=suites/testng-e2e-integration.xml

      # 6️⃣ Bước 6: Gom đúng thư mục target/allure-results theo lệnh của chị
      - name: Upload Allure Results Artifact
        if: always() # Đảm bảo pass hay fail đều lưu lại kết quả test
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-package
          path: target/allure-results/
          retention-days: 7